<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hear Me Out</title>
  <meta name="description" content="Hear Me Out is a second listener for health-coaching calls: it flags the sentence a person needs to see today, in English and Spanish. A human decides." />
  <meta name="theme-color" content="#1e3a5f" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Hear Me Out" />
  <meta property="og:description" content="A second listener for health-coaching calls. It flags the sentence a person needs to see today, in English and Spanish. A human decides." />
  <meta property="og:url" content="https://coachs-copilot.onrender.com/" />
  <!-- archie:theme-init -->
  <script>
    /* Applies the saved colour mode BEFORE first paint (no flash on reload). Key precedence: a valid <html data-theme-key="<id>.theme">
       first (apg prototypes), else `<VITE_ARCHIE_PROJECT_ID>.theme` through Vite's HTML env substitution (left as the literal placeholder
       when unset, so the fallback id applies), else `app.theme`. Default mode: data-theme-default (light|dark|system), else system. Same
       rules as src/lib/theme-key.ts (a test runs this script against it). Browser-only, no server state. */
    (function () {
      try {
        var d = document.documentElement;
        var raw = "%VITE_ARCHIE_PROJECT_ID%";
        var attr = d.getAttribute("data-theme-key");
        var key = attr && /^[A-Za-z0-9_-]{1,64}\.theme$/.test(attr) ? attr : (/^[A-Za-z0-9_-]{1,64}$/.test(raw) ? raw : "app") + ".theme";
        var ok = function (v) { return v === "light" || v === "dark" || v === "system"; };
        var m = null;
        try {
          m = localStorage.getItem(key);
          if (!ok(m)) {
            m = null;
            var legacy = ["archie-ui-theme", "archie-theme-mode"];
            for (var i = 0; i < legacy.length && !m; i++) {
              var v = localStorage.getItem(legacy[i]);
              if (ok(v)) { m = v; try { localStorage.setItem(key, v); } catch (e) {} }
            }
          }
        } catch (e) { m = null; }
        if (!m) m = d.getAttribute("data-theme-default") || "system";
        if (!ok(m)) m = "system";
        var dark = m === "dark" || (m === "system" && !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
        d.classList.remove("light", "dark");
        d.classList.add(dark ? "dark" : "light");
      } catch (e) {}
    })();
  </script>
  <!-- /archie:theme-init -->
</head>

<body>
  <div id="root"><p style="font-family: system-ui, sans-serif; max-width: 32rem; margin: 4rem auto; padding: 0 1rem; line-height: 1.5; color: #1e3a5f;">Hear Me Out. Waking the free server, about 30 to 60 seconds. This page loads on its own.</p></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
